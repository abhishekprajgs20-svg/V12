name: Build TXT 2 SHORTS V12 Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: r25b
  # multidict / yarl / frozenlist (aiohttp helpers) have optional C extensions.  Force their
  # pure-Python versions so nothing built for the build machine's CPU ends up inside the APK.
  PIP_NO_BINARY: multidict,yarl,frozenlist
  MULTIDICT_NO_EXTENSIONS: '1'
  YARL_NO_EXTENSIONS: '1'
  FROZENLIST_NO_EXTENSIONS: '1'

jobs:
  build-android:
    name: Build universal ARM APK
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip curl autoconf automake libtool libltdl-dev pkg-config cmake \
            build-essential zlib1g-dev libffi-dev libssl-dev libsqlite3-dev liblzma-dev file
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0" virtualenv

      - name: Download Android NDK ${{ env.NDK_VERSION }} (shared by FFmpeg and Buildozer)
        run: |
          curl -L --fail --retry 3 -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          unzip -q /tmp/ndk.zip -d "$HOME"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_API=24" >> "$GITHUB_ENV"

      - name: Cache FFmpeg build
        id: ffcache
        uses: actions/cache@v4
        with:
          path: libs
          key: ffmpeg-android-${{ hashFiles('scripts/build_ffmpeg_android.sh') }}

      - name: Compile Android FFmpeg for ARM64 and ARMv7
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: bash scripts/build_ffmpeg_android.sh

      - name: Check Python source syntax
        run: python -m py_compile main.py engine_v12.py

      - name: Point Buildozer at the shared NDK
        run: |
          sed -i "/^android.ndk_api/a android.ndk_path = $ANDROID_NDK_HOME" buildozer.spec
          grep -n "ndk" buildozer.spec

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform
          key: buildozer-sdk-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-sdk-

      - name: Build APK with Buildozer
        env:
          BUILDOZER_WARN_ON_ROOT: '0'
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build-log.txt

      - name: Verify APK contents
        run: |
          APK="$(ls bin/*.apk | head -n1)"
          echo "APK: $APK"
          unzip -l "$APK" | grep -E "lib/(arm64-v8a|armeabi-v7a)/libffmpegbin.so" | tee /tmp/ff.txt
          test "$(wc -l < /tmp/ff.txt)" -ge 2 || { echo "FFmpeg is missing from the APK"; exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: txt2shorts-v12-universal-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 7
